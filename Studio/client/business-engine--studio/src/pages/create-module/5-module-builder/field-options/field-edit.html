<b-right-widget ng-if="$.workingMode==='field-edit'" class="create-field"
    ng-class="{'was-validated':$.fieldForm.validated}" data-icon="notebook-template"
    data-title="Edit Field ({{$.currentField.FieldType}})" data-subtitle="Build custom module with more components"
    data-module="$" data-await-action="$.awaitAction" data-close-method="onCloseFieldWindow" data-hide-reload="true">
    <div class="d-flex">
        <!------------------------------------>
        <!--Field Basic Info-->
        <!------------------------------------>
        <div class="col-7 b-splitter border-end pe-3">
            <div class="b-field">
                <label class="form-label">Field Name</label>
                <div class="b-input-group">
                    <input type="text" id="txtFieldName" class="b-input form-control"
                        ng-model="$.currentField.FieldName" placeholder="Enter field name" autocomplete="off"
                        required />
                    <span><i class="codicon codicon-symbol-field"></i></span>
                </div>
                <div ng-if="$.currentField.FieldName && $.fieldForm.error.FieldName">
                    <p class="b-invalid">{{$.fieldForm.error.FieldName}}</p>
                    <button type="button" class="b-btn btn btn-action" ng-click="$.onSetValidFieldNameClick()">
                        Set Valid Name
                    </button>
                </div>
            </div>
            <div class="b-field"
                ng-class="{'opacity-50':$.currentField.Settings.IsDisabledLayout || $.currentField.Settings.IsHiddenFieldText}">
                <label class="form-label">Field Text</label>
                <div class="b-input-group">
                    <input type="text" id="txtFieldText" class="b-input form-control" b-focus="onEditField"
                        ng-model="$.currentField.FieldText" placeholder="Enter field text" autocomplete="off"
                        ng-disabled="$.currentField.Settings.IsDisabledLayout || $.currentField.Settings.IsHiddenFieldText"
                        ng-required="!$.currentField.Settings.IsDisabledLayout && !$.currentField.Settings.IsHiddenFieldText" />
                    <span><i class="codicon codicon-symbol-string"></i></span>
                </div>
            </div>
            <div class="b-field" ng-if="$.currentField.CanHaveValue">
                <label class="form-label d-block">Data Property</label>
                <div properties-editor editor-id="monacoFieldValueProperty" ng-model="$.currentField.FieldValueProperty"
                    data-suggestions="$.variablesAsFieldValueProperty">
                </div>
            </div>
            <div class="b-field field-type-selected mt-auto">
                <img class="field-image" ng-src="{{$.currentField.FieldTypeObject.Icon}}" />
                <div class="field-info">
                    <label class="field-title">{{$.currentField.FieldTypeObject.Title}}</label>
                    <p class="field-description b-scrollbar">{{$.currentField.FieldTypeObject.Description}}</p>
                </div>
            </div>
        </div>
        <div class="col-5 ps-3">
            <div class="b-field">
                <label class="form-label">Disable Layout</label>
                <label class="b-switch d-block">
                    <input type="checkbox" ng-model="$.currentField.Settings.IsDisabledLayout" />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="b-field" ng-class="{'opacity-50':$.currentField.Settings.IsDisabledLayout}">
                <label class="form-label d-block">Hide Field Text</label>
                <div class="field-component">
                    <label class="b-switch d-block">
                        <input type="checkbox" ng-model="$.currentField.Settings.IsHiddenFieldText"
                            ng-disabled="$.currentField.Settings.IsDisabledLayout">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div ng-if="$.currentField.CanHaveValue">
                <div class="b-field">
                    <label class="form-label d-block">Is Required</label>
                    <div class="field-component">
                        <label class="b-switch d-block">
                            <input type="checkbox" ng-model="$.currentField.IsRequired"
                                ng-disabled="!$.currentField.CanHaveValue">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div ng-class="{'opacity-50':!$.currentField.IsRequired}">
                    <div class="b-field">
                        <label class="form-label">Required Message</label>
                        <div class="b-input-group">
                            <input type="text" ng-model="$.currentField.Settings.RequiredMessage"
                                class="b-input form-control" placeholder="Required message"
                                ng-disabled="!$.currentField.IsRequired"
                                ng-required="$.currentField.CanHaveValue && $.currentField.IsRequired" />
                            <span><i class="codicon codicon-warning"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!------------------------------------>
    <!--Field Options-->
    <!------------------------------------>
    <div class="b-group mb-4" ng-if="$.fieldOptions">
        <div class="group-header" data-bs-toggle="collapse" data-bs-target="#grpFieldOptions">
            <h3 class="group-label">
                <span class="group-icon">
                    <i class="codicon codicon-gear"></i>
                </span>{{$.currentField.FieldTypeObject.Title}} More Options
            </h3>
            <span class="group-collapse">
                <i class="codicon codicon-chevron-up"></i>
            </span>
        </div>
        <div id="grpFieldOptions" class="group-content collapse show">
            <div ng-include="$.fieldOptions"></div>
        </div>
    </div>
    <!------------------------------------>
    <!--Field Template-->
    <!------------------------------------>
    <div class="b-group mb-4">
        <div class="group-header" data-bs-toggle="collapse" data-bs-target="#grpFieldTemplates">
            <h3 class="group-label">
                <span class="group-icon">
                    <i class="codicon codicon-server-process"></i>
                </span> Field Template
            </h3>
            <span class="group-collapse">
                <i class="codicon codicon-chevron-up"></i>
            </span>
        </div>
        <div id="grpFieldTemplates" class="group-content collapse show">
            <ul class="field-templates">
                <li class="template-item" ng-repeat="template in $.currentField.FieldTypeObject.Templates"
                    ng-class="{'active':template.TemplateName===$.currentField.Template}">
                    <button type="button" class="item-button" ng-click="$.onSelectFieldTemplate(template)">
                        <h6 class="template-name">{{template.TemplateName}}</h6>
                        <div class="image-wrapper">
                            <i ng-if="!template.TemplateImage" class="codicon codicon-preview"></i>
                            <img ng-if="template.TemplateImage" ng-src="{{template.TemplateImage}}" />
                        </div>
                        <p ng-if="template.Description" class="template-description">{{template.Description}}</p>
                        <p ng-if="!template.Description" class="template-no-description">No description!</p>
                    </button>
                </li>
            </ul>
            <p class="b-invalid msg-center" ng-if="$.fieldForm.error.Template">{{$.fieldForm.error.Template}}</p>
        </div>
    </div>
    <!------------------------------------>
    <!--Field Theme-->
    <!------------------------------------>
    <div class="b-group mb-4">
        <div class="group-header" data-bs-toggle="collapse" data-bs-target="#grpFieldThemes">
            <h3 class="group-label">
                <span class="group-icon">
                    <i class="codicon codicon-server-process"></i>
                </span> Field Theme
            </h3>
            <span class="group-collapse">
                <i class="codicon codicon-chevron-up"></i>
            </span>
        </div>
        <div id="grpFieldThemes" class="group-content collapse show">
            <ul class="field-templates">
                <li class="template-item" ng-repeat="theme in $.currentField.FieldTypeObject.Themes"
                    ng-if="!theme.TemplateName||theme.TemplateName===$.currentField.Template"
                    ng-class="{'active':theme.ThemeName===$.currentField.Theme}">
                    <button type="button" class="item-button" ng-click="$.onSelectFieldTheme(theme)">
                        <h6 class="template-name">{{theme.ThemeName}}</h6>
                        <div class="image-wrapper">
                            <i ng-if="!theme.ThemeImage" class="codicon codicon-preview"></i>
                            <img ng-if="theme.ThemeImage" ng-src="{{theme.ThemeImage}}" />
                        </div>
                        <p ng-if="theme.Description" class="template-description">{{theme.Description}}</p>
                        <p ng-if="!theme.Description" class="template-no-description">No description!</p>
                    </button>
                </li>
            </ul>
            <p class="b-invalid msg-center" ng-if="$.fieldForm.error.Theme">{{$.fieldForm.error.Theme}}</p>
        </div>
    </div>
    <hr class="mb-4" />
    <!------------------------------------>
    <!--Action Buttons-->
    <!------------------------------------>
    <div class="mb-1 d-flex justify-content-end mt-auto">
        <button type="button" class="b-btn btn-text-icon btn-submit me-2" ng-click="$.onSaveFieldClick($event,true)"
            ng-disabled="$.running">
            <i class="codicon codicon-save"></i>
            Save Field
        </button>
        <button type="button" class="b-btn btn-text-icon btn-cancel" ng-click="$.onCancelFieldClick()"
            ng-disabled="$.running">
            <i class="codicon codicon-circle-slash"></i>
            Cancel
        </button>
    </div>
</b-right-widget>
