<div ng-controller="createServiceController as $" class="create-service" ng-class="{'was-validated':$.form.validated}">
    <b-content-widget data-title="Create Service" data-icon="table" data-module-type="create-service"
        data-subtitle="Add or edit scenario service" data-await-action="$.awaitAction" data-module="$"
        data-reload-method="onPageLoad" data-close-method="onCloseWindow">
        <!------------------------------------>
        <!--Create Service Wizard-->
        <!------------------------------------>
        <div class="wizard-steps artin">
            <div class="wz-steps">
                <div class="wz-step" ng-click="$.onStepClick(1)"
                    ng-class="{'disabled':$.running || $.service.Id,'active':$.step===1}">
                    <span></span>Service Type
                </div>
                <div class="wz-step" ng-click="$.onStepClick(2)" ng-class="{'disabled':$.running,'active':$.step===2 }">
                    <span></span>Service Info
                </div>
                <div class="wz-step" ng-click="$.onStepClick(3)" ng-class="{'disabled':$.running,'active':$.step===3}">
                    <span></span>Service Builder
                </div>
            </div>
            <div class="step-content">
                <!------------------------------------>
                <!--Wizard Step 1 (Select Service Subtype)-->
                <!------------------------------------>
                <div ng-if="$.step===1 && !$.service.Id">
                    <p class="b-invalid msg-center">{{$.form.error.ServiceType}}</p>
                    <div ng-model="$.service.ServiceType" class="b-required" required>
                        <div class="b-group" ng-repeat="(key,value) in $.serviceTypes | groupBy:'ServiceDomain'">
                            <div class="group-header" data-bs-toggle="collapse"
                                data-bs-target="#grpServiceType{{$.service.Id}}_{{$index}}">
                                <h3 class="group-label">
                                    <span class="group-icon">
                                        <i class="codicon codicon-server-process"></i>
                                    </span> {{key}}
                                </h3>
                                <span class="group-collapse">
                                    <i class="codicon codicon-chevron-up"></i>
                                </span>
                            </div>
                            <div id="grpServiceType{{$.service.Id}}_{{$index}}" class="group-content collapse show">
                                <div class="row">
                                    <!--Select Service Subtype-->
                                    <div class="col mb-3" ng-repeat="serviceType in value | toArray:false">
                                        <div class="card service-type"
                                            ng-click="$.onSelectServiceTypeClick(serviceType)"
                                            ng-class="{'active':$.service.ServiceType===serviceType.ServiceType}">
                                            <div class="card-body text-center">
                                                <img class="service-image" ng-src="{{serviceType.Icon}}" />
                                                <h5 class="service-title">{{serviceType.Title}}</h5>
                                                <p class="service-summary b-scrollbar">{{serviceType.Description}}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="b-invalid msg-center">{{$.form.error.ServiceType}}</p>
                </div>
                <!------------------------------------>
                <!--Wizard Step 2 (Service Basic Info)-->
                <!------------------------------------>
                <div ng-if="$.step>=2" ng-show="$.step===2" class="d-flex">
                    <div class="col-7 b-splitter border-end pe-5 d-flex flex-column">
                        <div class="b-field">
                            <label class="form-label">Group</label>
                            <div class="b-input-group">
                                <select ng-model="$.service.GroupId" class="b-input form-select"
                                    ng-options="group.Id as group.GroupName for group in $.$rootScope.groups | filter:{GroupType:'Service'}"
                                    chosen inherit-select-classes="true"
                                    placeholder-text-single="'Select a group(optional)'">
                                    <option value=""></option>
                                </select>
                                <span><i class="codicon codicon-layers"></i></span>
                            </div>
                        </div>
                        <div class="b-field">
                            <label class="form-label">Service Name(Unique)</label>
                            <div class="b-input-group">
                                <input type="text" id="txtServiceName{{$.service.Id}}" ng-model="$.service.ServiceName"
                                    class="b-input form-control" placeholder="Enter service name(must be unique)"
                                    autocomplete="off" required />
                                <span><i class="codicon codicon-symbol-parameter"></i></span>
                            </div>
                            <div ng-if="$.service.ServiceName && $.form.error.ServiceName">
                                <p class="b-invalid">{{$.form.error.ServiceName}}</p>
                                <button type="button" class="b-btn btn btn-action" ng-click="$.onSetValidNameClick()"
                                    ng-disabled="$.running">
                                    Set Valid Name
                                </button>
                            </div>
                        </div>
                        <div class="b-field service-type-selected mt-auto">
                            <img class="service-image" ng-src="{{$.serviceType.Icon}}" />
                            <div class="service-info">
                                <label class="service-title">{{$.serviceType.Title}}</label>
                                <p class="service-description">{{$.serviceType.Description}}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col ps-5">
                        <div class="b-field">
                            <label class="form-label">Description</label>
                            <div class="b-input-group">
                                <textarea ng-model="$.service.Description" class="b-input form-control" rows="2"
                                    placeholder="Enter service description(for better development)"></textarea>
                                <span class="my-auto"><i class="codicon codicon-symbol-constant"></i></span>
                            </div>
                        </div>
                        <div class="b-field">
                            <label class="form-label">View Order</label>
                            <div class="b-input-group">
                                <input type="number" ng-model="$.service.ViewOrder" class="b-input form-control"
                                    placeholder="Enter service view order" />
                                <span><i class="codicon codicon-list-ordered"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
                <!------------------------------------>
                <!--Wizard Step 3 (Service Builder)-->
                <!------------------------------------>
                <div ng-show="$.step===3">
                    <div id="pnlServiceBuilder{{$.service.Id}}" class="service-builder"></div>
                </div>
                <hr class="mb-4" />
                <!------------------------------------>
                <!-- Buttons -->
                <!------------------------------------>
                <div class="d-flex mb-1">
                    <div class="d-flex justify-content-start">
                        <!-- Remove Button -->
                        <button type="button" class="b-btn btn-red-lite me-2" ng-click="$.onDeleteServiceClick()"
                            ng-disabled="$.running">
                            <i class="codicon codicon-trash"></i>
                        </button>
                        <!-- Previous Button -->
                        <button type="button" class="b-btn me-2" ng-click="$.onPreviousStepClick()"
                            ng-disabled="$.running || $.step===1">
                            <i class="codicon codicon-arrow-left"></i>
                        </button>
                        <!-- Next Button -->
                        <button type="button" class="b-btn me-2" ng-click="$.onNextStepClick()"
                            ng-disabled="$.running || $.step===3">
                            <i class="codicon codicon-arrow-right"></i>
                        </button>
                    </div>
                    <div class="d-flex justify-content-end ms-auto">
                        <button type="button" class="b-btn btn-text-icon btn-submit me-2" 
                            ng-click="$.onSaveServiceClick()" ng-disabled="$.running || !$.serviceBuilderInited">
                            <i class="codicon codicon-save"></i>
                            Save Service
                        </button>
                        <button type="button" class="b-btn btn-text-icon btn-cancel" ng-click="$.onCloseWindow()"
                            ng-disabled="$.running">
                            <i class="codicon codicon-circle-slash"></i>
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </b-content-widget>
</div>
