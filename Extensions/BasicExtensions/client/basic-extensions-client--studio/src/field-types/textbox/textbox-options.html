<div class="d-flex">
    <div class="col-7 border-end b-splitter pe-3">
        <div class="b-field">
            <label class="form-label">Input Type</label>
            <div class="b-input-group">
                <select ng-model="$.currentField.Settings.InputType" class="b-input form-control" chosen
                    inherit-select-classes="true" placeholder-text-single="'Select input type'">
                    <option value=""></option>
                    <option value="text">Text</option>
                    <option value="number">Number</option>
                    <option value="password">Password</option>
                    <option value="email">Email</option>
                    <option value="search">Search</option>
                    <option value="date">Date</option>
                    <option value="datetime">Date Time</option>
                    <option value="tel">Tel</option>
                    <option value="time">Time</option>
                </select>
                <span><i class="codicon codicon-symbol-interface"></i></span>
            </div>
        </div>
        <div class="b-field">
            <label class="form-label">Placeholder</label>
            <div class="b-input-group">
                <input type="text" ng-model="$.currentField.Settings.Placeholder" class="b-input form-control"
                    placeholder="Enter placeholder" />
                <span><i class="codicon codicon-symbol-string"></i></span>
            </div>
        </div>
        <div class="b-field">
            <label class="form-label">Autocomplete</label>
            <div class="b-input-group">
                <input type="search" ng-model="$.currentField.Settings.Autocomplete" list="autocompletes"
                    class="b-input form-control" placeholder="Enter autocomplete" />
                <datalist id="autocompletes">
                    <option value="off" />
                    <option value="on" />
                    <option value="username" />
                    <option value="name" />
                    <option value="family-name" />
                    <option value="country-name" />
                    <option value="country" />
                    <option value="additional-name" />
                    <option value="nickname" />
                    <option value="street-address" />
                    <option value="mobile" />
                    <option value="tel" />
                    <option value="email" />
                    <option value="url" />
                    <option value="organization" />
                    <option value="transaction-amount" />
                    <option value="postal-code" />
                    <option value="cc-number" />
                    <option value="cc-exp-year" />
                    <option value="cc-exp-month" />
                    <option value="billing" />
                    <option value="sex" />
                </datalist>
                <span><i class="codicon codicon-history"></i></span>
            </div>
        </div>
    </div>
    <div class="col ps-3">
        <div class="b-field">
            <label class="form-label">With Icon</label>
            <label class="b-switch d-block">
                <input type="checkbox" hidden="hidden" ng-model="$.currentField.Settings.WithIcon" />
                <div class="slider"></div>
            </label>
        </div>
        <div ng-class="{'opacity-25':!$.currentField.Settings.WithIcon}">
            <div class="b-field">
                <label class="form-label">Icon Position</label>
                <div class="b-radio-list inline-items">
                    <div class="radio-item">
                        <input type="radio" id="leftPosition" name="positionRadio" value="Left"
                            ng-model="$.currentField.Settings.IconPosition"
                            ng-disabled="!$.currentField.Settings.WithIcon">
                        <label for="leftPosition">Left</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="rightPosition" name="positionRadio" value="Right"
                            ng-model="$.currentField.Settings.IconPosition"
                            ng-disabled="!$.currentField.Settings.WithIcon">
                        <label for="rightPosition">Right</label>
                    </div>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">Font Icon</label>
                <div class="b-input-group">
                    <input type="text" ng-model="$.currentField.Settings.FontIcon" class="b-input form-control"
                        placeholder="Enter font icon" />
                    <span><i class="codicon codicon-smiley"></i></span>
                </div>
            </div>
        </div>
    </div>
</div>
