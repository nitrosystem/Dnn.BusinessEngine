<div class="form-check">
    <input class="form-check-input" type="checkbox" id="chk{{$.field.Id}}">
    <label class="form-check-label" ng-if="$.field.Settings.ShowLabel" for="chk{{$.field.Id}}">
        <input type="text" class="b-clean" ng-model="$.field.LabelText" autocomplete="off" />
    </label>
</div>
