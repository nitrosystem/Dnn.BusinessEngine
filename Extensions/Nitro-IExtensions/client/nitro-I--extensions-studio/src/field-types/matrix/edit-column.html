<b-right-widget ng-if="$.workingMode=='edit-column'" data-title="Edit Column" data-icon="notebook-template"
    data-subtitle="Add or edit matrix column" data-await-action="$.awaitAction">
    <div class="d-flex">
        <!------------------------------------>
        <!-- Left Fields -->
        <!------------------------------------>
        <div class="col-7 b-splitter border-end pe-3">
            <div class="b-field">
                <label class="form-label">Column Name</label>
                <div class="b-input-group">
                    <input type="text" class="b-input form-control" ng-model="$.column.ColumnName"
                        placeholder="Enter column name" autocomplete="off" required />
                    <span><i class="codicon codicon-gear"></i></span>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">Column Title</label>
                <div class="b-input-group">
                    <input type="text" class="b-input form-control" ng-model="$.column.ColumnTitle"
                        placeholder="Enter column title" autocomplete="off" required />
                    <span><i class="codicon codicon-gear"></i></span>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">Column Type</label>
                <div class="b-input-group">
                    <select ng-model="$.column.ColumnType" class="b-input form-select" chosen
                        inherit-select-classes="true" chosen placeholder-text-single="'Select column Type'" required>
                        <option value="Textbox">Textbox</option>
                        <option value="Textarea">Textarea</option>
                        <option value="DropdownList">Dropdown List</option>
                    </select>
                    <span><i class="codicon codicon-activate-breakpoints"></i></span>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">Input Type</label>
                <div class="b-input-group">
                    <select ng-model="$.column.InputType" class="b-input form-select" chosen
                        inherit-select-classes="true" chosen placeholder-text-single="'Select input Type'" required>
                        <option value="text">Text</option>
                        <option value="number">Number</option>
                        <option value="time">Time</option>
                    </select>
                    <span><i class="codicon codicon-activate-breakpoints"></i></span>
                </div>
            </div>
            <div class="b-field"
                ng-if="$.column.ColumnType=='DropdownList' || $.column.ColumnType=='CheckboxList' || $.column.ColumnType=='RadioButtonList'">
                <label class="form-label">Options</label>
                <textarea class="form-control b-input" ng-model="$.column.Options" placeholder="One option per line"
                    rows="6"></textarea>
            </div>
            <div class="b-field">
                <label class="form-label">Column Placeholder</label>
                <div class="b-input-group">
                    <input type="text" class="b-input form-control" ng-model="$.column.Placeholder"
                        placeholder="Enter column placeholder" autocomplete="off" />
                    <span><i class="codicon codicon-gear"></i></span>
                </div>
            </div>
        </div>
        <!------------------------------------>
        <!-- Right Fields -->
        <!------------------------------------>
        <div class="col-5 ps-3">
            <div class="b-field">
                <div class="form-label">Is Required</div>
                <label class="b-switch">
                    <input type="checkbox" ng-model="$.column.IsRequired">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="b-field">
                <label class="form-label">Column Width</label>
                <div class="b-input-group">
                    <input type="text" class="b-input form-control" ng-model="$.column.ColumnWidth"
                        placeholder="Enter column width" autocomplete="off" required />
                    <span><i class="codicon codicon-gear"></i></span>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">Header Css</label>
                <div class="b-input-group">
                    <input type="text" class="b-input form-control" ng-model="$.column.HeaderCssClass"
                        placeholder="Enter column css class" autocomplete="off" required />
                    <span><i class="codicon codicon-gear"></i></span>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">Header Icon</label>
                <div class="b-input-group">
                    <input type="text" class="b-input form-control" ng-model="$.column.HeaderIcon"
                        placeholder="Enter column icon" autocomplete="off" required />
                    <span><i class="codicon codicon-gear"></i></span>
                </div>
            </div>
            <div class="b-field">
                <label class="form-label">View Order</label>
                <div class="b-input-group">
                    <input type="number" class="b-input form-control" ng-model="$.column.ViewOrder"
                        placeholder="Enter column view order" autocomplete="off" />
                    <span><i class="codicon codicon-list-ordered"></i></span>
                </div>
            </div>
        </div>
    </div>
    <hr class="mb-4" />
    <div class="mb-1 d-flex justify-content-end mt-auto">
        <button type="button" class="b-btn btn-submit me-2" ng-click="$.onSaveColumnClick()">
            <i class="codicon codicon-save"></i>
            Save Column
        </button>
        <button type="button" class="b-btn btn-cancel" ng-click="$.onCancelColumnClick()">
            <i class="codicon codicon-circle-slash"></i>
            Cancel
        </button>
    </div>
</b-right-widget>
